[project]
name = "balance-coop"
version = "0.1.0"
description = ""
authors = [
    {name = "Vincent Bisserie", email = "vbisserie@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "Werkzeug>=0.16.1,<0.17",
    "Flask-socketio==4.3.2",
    "python-escpos>=3.0a8,<4",
    "validx>=0.7,<0.8",
    "dotmap>=1.3.23,<2",
    "ruamel.yaml>=0.17.2,<0.18",
    "MarkupSafe==2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=5.2,<6",
    "pre-commit>=2.9.3,<3",
    "importlib-metadata>=3.7.0,<4",
]

[project.scripts]
balance-coop = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "api/",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
